name: Release Installer ISO

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update"
        required: true
        default: "v0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-iso:
    name: Release ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    concurrency:
      group: release-installer-${{ github.ref_name || github.event.inputs.tag }}
      cancel-in-progress: false

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Show flake metadata
        run: nix flake metadata --accept-flake-config --no-write-lock-file

      - name: Run flake checks
        run: nix flake check --accept-flake-config --no-write-lock-file -L

      - name: Build installer ISO
        run: nix build .#installer-iso --accept-flake-config --no-write-lock-file -L

      - name: Package release assets
        run: |
          mkdir -p dist
          cp -v result/iso/* dist/
          sha256sum dist/* | tee dist/SHA256SUMS

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: niri-installer-release-${{ steps.tag.outputs.value }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Niri Installer ${{ steps.tag.outputs.value }}
          body: Automated installer ISO build for ${{ steps.tag.outputs.value }}.
          files: |
            dist/*.iso
            dist/SHA256SUMS
          fail_on_unmatched_files: true
